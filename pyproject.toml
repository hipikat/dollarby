[project]
name = "dollarby"
version = "0.1.0"
description = "My personal tax and financing helpers"
readme = "README.md"
authors = [
    { name = "Ada Wright", email = "ada@hpk.io" }
]
requires-python = ">=3.14"
dependencies = [
    "click>=8.4.2",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "textual>=8.2.8",
]

[project.scripts]
dollarby = "dollarby.cli:cli"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pandas-stubs>=3.0.5.260730",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.2",
    "ty>=0.0.68",
]

### Pytest
[tool.pytest.ini_options]
# Four workers currently beat ten by avoiding repeated Python/Textual startup overhead.
addopts = ["-n", "4", "--strict-config", "--strict-markers"]
asyncio_mode = "strict"
testpaths = ["tests"]

### Ty
[tool.ty.rules]
all = "error"

[tool.ty.analysis]
respect-type-ignore-comments = false
strict-equality-semantics = true

### Ruff
[tool.ruff]
include     = ["*.py"]
line-length = 100
cache-dir   = "~/.cache/ruff"
exclude     = [".venv"]
fix          = true
show-fixes   = true
indent-width = 4

[tool.ruff.lint]
# Ignore underscore-prefixed variables, args, and kwargs, in "unused-variable checks".
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?)|args|kwargs)$"
select = [
  "ALL", # Enable all linting rules.
]
ignore = [
  "D203",     # One blank line required before class docstring
  "EM101",    # Allow string literals in Exception("Messages")
  "CPY001",   # Don't enforce copyright notices at the top of files
  "COM812",   # Don't enforce trailing commas
]
fixable = [
  "ALL", # All fixable rules will be automatically corrected.
]

[tool.ruff.format]
docstring-code-format = true # Reformat code blocks in docstrings.

[tool.ruff.lint.pydocstyle]
convention = "google" # Use Google's docstring conventions.

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "INP001", # Suppress warnings for implicit namespace packages in test directories.
  "S101",   # Allow usage of `assert` in tests.
]
